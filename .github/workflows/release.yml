name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Tester-profile smoke
        env:
          QUILL_PROFILE: tester
        run: python -m pytest tests/test_first_run.py tests/test_trust_layer.py tests/test_mcp_tools.py tests/test_exhaust_ingest.py tests/test_external_capture.py tests/test_crash_report.py -q
      - name: PyInstaller onedir
        run: pyinstaller packaging/mnemos.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mnemos-windows-onedir
          path: dist/Mnemos

  macos-meeting:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Launcher scripts parse on a real macOS bash
        # `bash -n` here rather than only in the test suite: macOS ships bash
        # 3.2, and syntax the Linux CI accepts can still strand the cohort on
        # install. This is the cheapest part of the Mac dry run to automate.
        run: |
          bash -n install.command
          bash -n start.command
          test -x install.command
          test -x start.command
      - name: Meeting-path subset
        env:
          QUILL_FIRST_RUN_MODE: meeting
        run: python -m pytest tests/test_first_run.py tests/test_meeting_session.py tests/test_mcp_tools.py tests/test_trust_layer.py -q
      - name: macOS tester path + honest capture degradation
        # Runs with sys.platform == "darwin" for real, so the capture-support
        # map is exercised on the platform it describes.
        run: python -m pytest tests/test_macos_path.py tests/test_capture_privacy.py -q
