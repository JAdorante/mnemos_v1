name: release

on:
  push:
    tags: ["v*"]
  # Packaging breaks quietly and only in the packaged build — the spec once
  # excluded torch, which removes VAD and therefore every memory, and nothing
  # caught it because CI built the bundle and never launched it.
  pull_request:
    paths:
      - "packaging/**"
      - "desktop_app.py"
      - "app/runtime.py"
      - "app/services/model_fetch.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Sync UI static assets
        run: python scripts/sync_ui_static.py
      - name: Tester-profile smoke
        env:
          QUILL_PROFILE: tester
        run: python -m pytest tests/test_first_run.py tests/test_trust_layer.py tests/test_mcp_tools.py tests/test_exhaust_ingest.py tests/test_external_capture.py tests/test_crash_report.py tests/test_ui_tokens.py -q
      - name: Desktop shell dependencies
        run: pip install -r packaging/requirements-desktop.txt
      - name: PyInstaller onedir
        run: pyinstaller packaging/mnemos.spec

      - name: The build can load what it needs
        # The check that would have caught the torch exclusion on day one:
        # silero_vad imports torch even in ONNX mode, so a bundle without it
        # starts fine, serves /health fine, and hears nothing forever.
        run: .\dist\Mnemos\Mnemos.exe --self-test

      - name: It starts and answers on localhost
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -FilePath '.\dist\Mnemos\Mnemos.exe' `
               -ArgumentList '--no-window', '--no-tray'
          try {
            $ok = $false
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 5
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8000/health' -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; Write-Host $r.Content; break }
              } catch { }
            }
            if (-not $ok) { throw 'the packaged app never answered /health' }
          } finally {
            taskkill /PID $p.Id /T /F 2>$null
          }

      - name: Report the bundle size
        # A tester downloads this. Print it so a 3 GB regression is visible in
        # the log rather than discovered by someone on a hotel connection.
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-ChildItem -Recurse dist\Mnemos |
                Measure-Object -Property Length -Sum).Sum / 1MB)
          Write-Host "bundle: $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: mnemos-windows-onedir
          path: dist/Mnemos

      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          # ${env:...} braces are required: PowerShell parses the "(x86)" in
          # $env:ProgramFiles(x86) as a method call and the path comes back empty.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\mnemos.iss
      - uses: actions/upload-artifact@v4
        with:
          name: mnemos-windows-setup
          path: dist/MnemosSetup.exe

  macos-meeting:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Sync UI static assets
        run: python scripts/sync_ui_static.py
      - name: Launcher scripts parse on a real macOS bash
        # `bash -n` here rather than only in the test suite: macOS ships bash
        # 3.2, and syntax the Linux CI accepts can still strand the cohort on
        # install. This is the cheapest part of the Mac dry run to automate.
        run: |
          bash -n install.command
          bash -n start.command
          test -x install.command
          test -x start.command
      - name: Meeting-path subset
        env:
          QUILL_FIRST_RUN_MODE: meeting
        run: python -m pytest tests/test_first_run.py tests/test_meeting_session.py tests/test_mcp_tools.py tests/test_trust_layer.py tests/test_ui_tokens.py -q
      - name: macOS tester path + honest capture degradation
        # Runs with sys.platform == "darwin" for real, so the capture-support
        # map is exercised on the platform it describes.
        run: python -m pytest tests/test_macos_path.py tests/test_capture_privacy.py -q
