      - "app/api/web_ingest.py"
      - "app/main.py"
      - "app/services/data/freemail_domains.json"
      - "app/perception/psl.py"
      - "app/perception/data/public_suffix_list.dat"
      - "app/storage.py"
      - "app/api/routes.py"
      - "data/source_policies.json"
      - "scripts/eval_entity_typing.py"
      - "scripts/entity_repair.py"
      - "scripts/seed_seat_vocab.py"
      - "scripts/entity_metrics.py"
      - "tests/fixtures/goldens/entity_typing.jsonl"
