  workflow_dispatch:

jobs:
  entity:
    name: entity golden gate and unit tests (linux)
    runs-on: ubuntu-latest
    env:
      # The hosted seats run Python 3.12; the tests need no model, no
      # extraction heads, no speech and no Hugging Face download.
      QUILL_HEADS: "off"
      QUILL_USAGE_LEDGER: "0"
      QUILL_TTS: "off"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Golden gate and entity model tests
        run: |
          export QUILL_DATA_DIR="$(mktemp -d)"
          python -m unittest -v \
            tests.test_entity_typing_golden \
            tests.test_entity_candidates \
            tests.test_entity_typing \
            tests.test_entity_decisions \
            tests.test_entity_tombstones \
            tests.test_entity_kind_provenance \
            tests.test_entity_merge \
            tests.test_entity_scope \
            tests.test_entity_repair \
            tests.test_entity_metrics \
            tests.test_entity_decision_trail \
            tests.test_entity_carryovers \
            tests.test_entity_carryovers_b \
            tests.test_entity_carryovers_c \
            tests.test_entity_fixpass_a \
            tests.test_entity_fixpass_b \
            tests.test_entity_fixpass_v \
            tests.test_entity_kind_hygiene \
            tests.test_seat_vocab \
            tests.test_free_mail \
            tests.test_email_domain_orgs \
            tests.test_assistant_bind_only
