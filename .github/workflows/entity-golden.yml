# Entity model check: the entity typing golden gate and the entity model's
# unit tests.
#
# The failures these catch are quiet. A model "project" that becomes a
# project again, a forgotten name that comes back, a company sent to People:
# none of them raises, they change what the Orgs & tools tab and the People
# tab show. Changes land on main directly as often as through a pull request,
# so this runs on both. No model, no audio, no network beyond pip: the golden
# replay runs the real extractor entity path with the name embedder off.
name: entity-golden

on:
  push:
    branches: [main]
    paths:
      - "app/services/entity_*.py"
      - "app/services/extractor.py"
      - "app/services/resolution.py"
