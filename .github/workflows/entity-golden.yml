      - "app/services/meeting_debrief.py"
      - "app/services/onboarding.py"
      - "app/services/onboarding_scan.py"
      - "app/services/self_profile.py"
      - "app/services/people_escrow.py"
      - "app/services/peer_channel.py"
      - "app/services/assistant_inbox.py"
      - "app/services/mmr.py"
      - "app/perception/l3_workers.py"
      - "app/api/adoption.py"
      - "app/api/profile_page.py"
      - "app/api/shell_routes.py"
      - "app/api/web_ingest.py"
      - "app/main.py"
      - "app/services/data/freemail_domains.json"
      - "app/perception/psl.py"
      - "app/perception/data/public_suffix_list.dat"
      - "app/storage.py"
      - "app/api/routes.py"
      - "data/source_policies.json"
