      - ".github/workflows/entity-golden.yml"
  pull_request:
    paths:
      - "app/services/entity_*.py"
      - "app/services/extractor.py"
      - "app/services/resolution.py"
      - "app/services/name_quality.py"
      - "app/services/people_pipeline.py"
      - "app/services/person_adjudicator.py"
      - "app/services/ambient_cleanup.py"
      - "app/services/projects.py"
      - "app/services/project_rollup.py"
      - "app/services/kg_keys.py"
      - "app/services/kg_beliefs.py"
      - "app/services/source_policy.py"
      - "app/services/mint_recurrence.py"
      - "app/services/free_mail.py"
      - "app/services/inbox.py"
      - "app/services/context/surfaces.py"
      - "app/services/context/keys.py"
      - "app/services/chat_ingest.py"
